- id: browser-01
  backend: browser
  prompt: 'Open https://example.com and save a short summary of the page to {workdir}/browser/task-01.md'
  setup:
    - type: mkdir
      path: '{workdir}/browser'
  check:
    type: file_contains
    path: '{workdir}/browser/task-01.md'
    text: 'summary'
  artifacts: ['{workdir}/browser/task-01.md']

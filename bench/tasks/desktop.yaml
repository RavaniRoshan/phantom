- id: desktop-01
  backend: desktop
  prompt: 'Using Notepad, complete desktop step 01 and write a completion marker'
  setup:
    - type: mkdir
      path: '{workdir}/desktop/artifacts'
  check:
    type: file_exists
    path: '{workdir}/desktop/artifacts/desktop-01.done'
  artifacts: ['{workdir}/desktop/artifacts/desktop-01.done']
